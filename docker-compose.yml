  services:
    # PostgreSQL database
    postgres:
      image: postgres:16-alpine
      container_name: looki-db
      restart: always
      env_file:
        - ./config.env
      environment:
        POSTGRES_DB: ${POSTGRES_DB:-looki}
        POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-looki}
        POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-looki123}
      ports:
        - "${POSTGRES_PORT:-5432}:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME:-looki} -d ${POSTGRES_DB:-looki}"]
        interval: 5s
        timeout: 5s
        retries: 10

    # pgAdmin
    pgadmin:
      image: dpage/pgadmin4:latest
      container_name: looki-pgadmin
      restart: always
      environment:
        PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@looki.tn}
        PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      ports:
        - "${PGADMIN_PORT:-5050}:80"
      depends_on:
        postgres:
          condition: service_healthy
      volumes:
        - pgadmin_data:/var/lib/pgadmin

    # Spring Boot API
    api:
      image: eclipse-temurin:17-jdk-alpine
      container_name: looki-api
      restart: always
      working_dir: /app
      entrypoint: ["sh", "-c", "java -jar app.jar --server.port=${PORT:-8080}"]
      depends_on:
        postgres:
          condition: service_healthy
      env_file:
        - ./localconf.env
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-looki}
        SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-looki}
        SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-looki123}
        JWT_SECRET: ${JWT_SECRET}
        PORT: 8080
      volumes:
        - ./target/looki-service-0.0.1-SNAPSHOT.jar:/app/app.jar
      ports:
        - "${SERVER_PORT:-8080}:8080"
  volumes:
    pgdata:
    pgadmin_data:


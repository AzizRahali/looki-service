  services:
    # PostgreSQL database
    postgres:
      image: postgres:16-alpine
      container_name: loomea-db
      restart: always
      env_file:
        - ./config.env
      environment:
        POSTGRES_DB: ${POSTGRES_DB:-loomea}
        POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-loomea}
        POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-loomea123}
      ports:
        - "${POSTGRES_PORT:-5432}:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME:-loomea} -d ${POSTGRES_DB:-loomea}"]
        interval: 5s
        timeout: 5s
        retries: 10

    # Spring Boot API
    api:
      image: eclipse-temurin:17-jdk-alpine
      container_name: loomea-api
      restart: always
      working_dir: /app
      entrypoint: ["sh", "-c", "java -jar app.jar --server.port=${PORT:-8080}"]
      depends_on:
        postgres:
          condition: service_healthy
      env_file:
        - ./localconf.env
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-loomea}
        SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-loomea}
        SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-loomea123}
        JWT_SECRET: ${JWT_SECRET}
        PORT: 8080
      volumes:
        - ./target/loomea-service-0.0.1-SNAPSHOT.jar:/app/app.jar
      ports:
        - "${SERVER_PORT:-8080}:8080"
  volumes:
    pgdata:


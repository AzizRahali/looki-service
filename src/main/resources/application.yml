  spring:
    application:
      name: looki-service

    datasource:
      url: ${SPRING_DATASOURCE_URL}
      username: ${SPRING_DATASOURCE_USERNAME}
      password: ${SPRING_DATASOURCE_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        auto-commit: false

    jpa:
      hibernate:
        ddl-auto: update   # change to 'validate' in production later
      show-sql: false
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true
      open-in-view: false

    jackson:
      serialization:
        FAIL_ON_EMPTY_BEANS: false

  server:
    port: ${PORT:8080}

  # JWT & Booking
  app:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 86400000        # 24 hours
      refresh-expiration-ms: 604800000  # 7 days
    booking:
      pending-timeout-minutes: 15

    # Looki AI model hosted on Modal (see ai/looki_ai_modal.py). Features fall
    # back to non-AI behaviour when their URL or the token is empty.
    ai:
      modal-token: ${MODAL_AI_TOKEN:}
      timeout-seconds: ${MODAL_AI_TIMEOUT_SECONDS:90}
      max-requests-per-minute: ${MODAL_AI_MAX_REQUESTS_PER_MINUTE:20}
    smart-search:
      modal-url: ${MODAL_SEARCH_URL:}
    owner-insights:
      modal-url: ${MODAL_INSIGHTS_URL:}
    support:
      modal-url: ${MODAL_SUPPORT_URL:}
    # Business time zone for "today", availability and insights periods.
    time-zone: Africa/Tunis

    # SendGrid (email OTP & password reset)
    sendgrid:
      api-key: ${SENDGRID_API_KEY:}
      from-email: ${SENDGRID_FROM_EMAIL:noreply@looki.tn}

    # Stripe payment gateway
    stripe:
      secret-key: "sk_test_51TQUOoGclSemIXgylgchCPmsh3uxS27oRNyDMFUZIU5E7nb1NcISLJYsepkR9HfhqpwL7VO8t01LzHfA9MlUFa5Z00gg3rKtYx"
      # Optional: Stripe webhook endpoint secret (whsec_...).
      # Leave blank to rely solely on Flutter polling (fine for local dev).
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      # Currency every charge is made in (the Stripe account can't charge TND).
      currency: ${STRIPE_CURRENCY:usd}
      # Charge-currency units per 1 TND of app price. 1 = charge the number as-is.
      conversion-rate: ${STRIPE_CONVERSION_RATE:1}
      # Leave blank to use {backend}/api/payments/return, which the in-app
      # WebView intercepts and browsers show as a "return to the app" page.
      success-url: ${STRIPE_SUCCESS_URL:}
      cancel-url: ${STRIPE_CANCEL_URL:}

  # OpenAPI / Swagger
  springdoc:
    api-docs:
      path: /api-docs
    swagger-ui:
      path: /swagger-ui.html

  # Logging (optional but useful)
  logging:
    level:
      org.springframework: INFO
      org.hibernate.SQL: WARN


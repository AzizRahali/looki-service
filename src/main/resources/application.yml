  spring:
    application:
      name: loomea-service

    datasource:
      url: ${SPRING_DATASOURCE_URL}
      username: ${SPRING_DATASOURCE_USERNAME}
      password: ${SPRING_DATASOURCE_PASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        auto-commit: false

    jpa:
      hibernate:
        ddl-auto: update   # change to 'validate' in production later
      show-sql: false
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true
      open-in-view: false

    jackson:
      serialization:
        FAIL_ON_EMPTY_BEANS: false

  server:
    port: ${PORT:8080}

  # JWT & Booking
  app:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 86400000        # 24 hours
      refresh-expiration-ms: 604800000  # 7 days
    booking:
      pending-timeout-minutes: 15

    # SendGrid (email OTP & password reset)
    sendgrid:
      api-key: ${SENDGRID_API_KEY:}
      from-email: ${SENDGRID_FROM_EMAIL:noreply@looki.tn}

    # Stripe payment gateway
    stripe:
      secret-key: "sk_test_51TQUOoGclSemIXgylgchCPmsh3uxS27oRNyDMFUZIU5E7nb1NcISLJYsepkR9HfhqpwL7VO8t01LzHfA9MlUFa5Z00gg3rKtYx"
      # Optional: Stripe webhook endpoint secret (whsec_...).
      # Leave blank to rely solely on Flutter polling (fine for local dev).
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      # Intercepted by the in-app WebView — don't need to resolve as real pages.
      success-url: ${STRIPE_SUCCESS_URL:https://loomea.app/payment/success}
      cancel-url: ${STRIPE_CANCEL_URL:https://loomea.app/payment/cancel}

  # OpenAPI / Swagger
  springdoc:
    api-docs:
      path: /api-docs
    swagger-ui:
      path: /swagger-ui.html

  # Logging (optional but useful)
  logging:
    level:
      org.springframework: INFO
      org.hibernate.SQL: WARN

